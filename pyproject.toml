[project]
name = "au-core-gateway"
version = "1.1.0"
description = "Converts HL7 v2 patient data to Australian AU Core FHIR and validates it with the official HL7 validator"
requires-python = ">=3.11"
dependencies = ["pyyaml==6.0.3"]   # exact pins: the versions the test suite runs on

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only gateway/ is the Python package; fixtures/, scripts/ and tools/ are not.
[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.setuptools.package-data]
"gateway.mapping" = ["rules/*.yaml"]
"gateway" = ["hl7_names.json"]
"gateway.inspector" = ["page.html"]
"gateway.dashboard" = ["template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "validator: runs the real HL7 FHIR validator on the fixtures (needs Java and `make setup`)",
    "scale: generates a Synthea population and runs it end to end (needs Java; minutes)",
]
addopts = "-m 'not validator and not scale'"
