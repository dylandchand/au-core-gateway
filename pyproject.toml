[project]
name = "au-core-gateway"
version = "0.1.0"
description = "Converts HL7 v2 patient data to Australian AU Core FHIR and validates it with the official HL7 validator"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only gateway/ is the Python package; fixtures/, scripts/ and tools/ are not.
[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.setuptools.package-data]
"gateway.mapping" = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["validator: runs the real HL7 FHIR validator (needs Java and `make setup`)"]
addopts = "-m 'not validator'"
