# What each fixture MUST produce. The integration test compares the actual report with this
# file exactly: every expected error must appear at the expected source field, and no other
# errors may appear. Change this file only when you have decided the spec requires it,
# never just to make a test pass.
#
# Error ids are the validator's message ids (or the gateway's own ingest./mapping./link. codes);
# "at" is the HL7 v2 source locator the error must be traced to. OBX(2)-5 means field 5 of the
# second OBX segment. Listed "warnings" must also appear (other warnings are allowed).

golden:
  clean-patients.hl7:
    records: 5
    all_pass: true

  lab-results.hl7:
    records: 2
    all_pass: true

  # A second lab (rules: demo-lab-b.yaml), reporting on patients the first lab registered.
  # Report 1 links by IHI (its own MRN is from another issuer, so it cannot match the first
  # lab's); report 2 quotes only the first lab's MRN (CX-4 DEMOLAB) and links by it. Both use
  # the lab's own test codes, translated to LOINC by its rules file.
  lab-b-results.hl7:
    records: 2
    all_pass: true

faults:
  ihi-bad-check-digit.hl7:
    why: last digit of the IHI changed, so the Luhn check fails (AU Base inv-ihi-value-2)
    errors:
      - {id: "http://hl7.org.au/fhir/StructureDefinition/au-ihi#inv-ihi-value-2", at: "PID-3[1]"}

  ihi-wrong-prefix.hl7:
    why: 800361 is the HPI-I range; a valid Luhn digit isolates the prefix rule (inv-ihi-value-1)
    errors:
      - {id: "http://hl7.org.au/fhir/StructureDefinition/au-ihi#inv-ihi-value-1", at: "PID-3[1]"}

  missing-birth-date.hl7:
    why: PID-7 empty; AU Core Patient.birthDate is 1..1
    errors:
      - {id: "Validation_VAL_Profile_Minimum", at: "PID-7"}

  impossible-birth-date.hl7:
    why: 31 February. The gateway rejects it at ingest, and the validator then reports the
      missing birthDate. Both point at PID-7.
    errors:
      - {id: "ingest.bad-date", at: "PID-7"}
      - {id: "Validation_VAL_Profile_Minimum", at: "PID-7"}

  missing-sex.hl7:
    why: PID-8 empty; AU Core Patient.gender is 1..1
    errors:
      - {id: "Validation_VAL_Profile_Minimum", at: "PID-8"}

  unmapped-sex-code.hl7:
    why: X is not in HL7 table 0001 or the rules file; the gateway refuses to guess
    errors:
      - {id: "mapping.unmapped-code", at: "PID-8"}
      - {id: "Validation_VAL_Profile_Minimum", at: "PID-8"}

  no-identifiers.hl7:
    why: PID-3 empty; AU Core requires at least one identifier (1..*) and au-core-pat-01
    errors:
      - {id: "Validation_VAL_Profile_Minimum", at: "PID-3"}
      - {id: "http://hl7.org.au/fhir/core/StructureDefinition/au-core-patient#au-core-pat-01", at: "PID-3"}

  # --- Phase 2: lab results (ORU^R01) ---------------------------------------------------

  lab-orphan-result.hl7:
    why: results for a patient who was never registered; filing them would attach results to
      nobody, so the report is rejected and traced to the identifiers that matched nothing
    errors:
      - {id: "link.orphan-result", at: "PID-3"}

  lab-non-numeric-value.hl7:
    why: second result is type NM (numeric) but holds "6,1" (decimal comma); the first is clean
    errors:
      - {id: "ingest.bad-numeric", at: "OBX(2)-5"}

  lab-impossible-datetime.hl7:
    why: result time in month 13
    errors:
      - {id: "ingest.bad-datetime", at: "OBX(1)-14"}

  lab-name-mismatch.hl7:
    why: the IHI matches a registered patient but the family name differs. Not an error (names
      can legitimately differ in spelling), but it must be flagged for a person to check.
    errors: []
    warnings:
      - {id: "link.demographic-mismatch", at: "PID-5[1].1"}

  # --- Phase 3: results as AU Core pathology Observations ---------------------------------

  obs-unmapped-status.hl7:
    why: OBX-11 "Z" is not in HL7 table 0085 or the rules file, so the gateway refuses to guess
      a status, and AU Core (like base FHIR) requires Observation.status 1..1
    errors:
      - {id: "mapping.unmapped-code", at: "OBX(1)-11"}
      - {id: "Validation_VAL_Profile_Minimum", at: "OBX(1)-11"}

  obs-unknown-coding-system.hl7:
    why: OBX-3.3 "XX" names no known coding system, so the test code cannot be given a FHIR
      system. The code keeps its text (allowed by the extensible binding), and the gateway
      reports the unmapped system
    errors:
      - {id: "mapping.unmapped-code", at: "OBX(1)-3.3"}

  # --- Phase 4 -----------------------------------------------------------------------------

  lab-bad-loinc-check-digit.hl7:
    why: 4548-5 fails the Mod 10 check digit in the LOINC Users' Guide (Appendix C); the real
      code is 4548-4. Offline the validator cannot look LOINC up, so the gateway checks the
      digit at ingest and does not convert the result
    errors:
      - {id: "ingest.bad-loinc-code", at: "OBX(1)-3"}

  ihi-unknown-authority.hl7:
    why: the IHI's assigning authority is misspelt (AUSHC), so no rule recognises it and the IHI
      is dropped. The Patient still conforms (Medicare and MRN satisfy AU Core), which is the
      danger; only the gateway's warning shows the IHI was lost
    errors: []
    warnings:
      - {id: "ingest.unmapped-identifier", at: "PID-3[1]"}

  birth-date-day-first.hl7:
    why: birth date written DD/MM/YYYY; HL7 v2 dates are YYYY[MM[DD]], so ingest rejects it
      rather than guessing day and month, and AU Core then reports birthDate missing
    errors:
      - {id: "ingest.bad-date", at: "PID-7"}
      - {id: "Validation_VAL_Profile_Minimum", at: "PID-7"}

  lab-multipart-value.hl7:
    why: OBX-5 holds two values (5.6~6.1). Keeping only the first would change the result, so
      ingest reports it and the result is not converted (CLAUDE.md, never alter clinical content)
    errors:
      - {id: "ingest.unsupported-value", at: "OBX(1)-5"}

  # --- A second sender (routing, MRN issuers, local codes) ---------------------------------

  unknown-sender.hl7:
    why: MSH-3/MSH-4 name a sender no rules file covers. Reading it with another sender's rules
      would be a guess, so the gateway does not convert it and says which sender it did not know
    errors:
      - {id: "ingest.unknown-sender", at: "MSH-3"}

  lab-b-mrn-other-issuer.hl7:
    why: the only identifier is an MRN the second lab issued, and it is the same number the first
      lab issued to a different patient. An MRN is unique only within its issuer, so it must not
      match; matching on the number alone would file these results under the wrong person
    errors:
      - {id: "link.orphan-result", at: "PID-3"}

  lab-b-unmapped-local-code.hl7:
    why: the lab's own test code CRP is not in its rules file's translation table, so the gateway
      refuses to guess a LOINC code. The code keeps the lab's text (allowed by the extensible
      binding), and the gateway reports the untranslated code
    errors:
      - {id: "mapping.unmapped-code", at: "OBX(1)-3"}

  lab-b-time-no-timezone.hl7:
    why: the result time has hours and minutes but no timezone. FHIR requires a timezone with a
      time, and the gateway never guesses one, so it keeps the date only and says so
    errors: []
    warnings:
      - {id: "ingest.datetime-no-timezone", at: "OBX(1)-14"}
