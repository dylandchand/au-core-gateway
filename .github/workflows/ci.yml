name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the code. Caches and artifacts use their
# own runtime token, so nothing here can push, open issues or change repo settings, even when
# CI runs on a pull request from someone else's fork.
permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Fixtures are reproducible
        run: |
          python scripts/make_fixtures.py
          git diff --exit-code -- fixtures/
      - run: python -m pytest -q

  docker:
    # The spec's clean-machine promise: from a fresh clone, `docker compose up` builds the
    # image (official validator, pinned packages) and runs the demo. The results must match
    # fixtures/expectations.yaml exactly, as the native conformance tests require.
    name: Docker (clean clone, docker compose up)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: docker compose up --build --abort-on-container-exit --exit-code-from gateway
      - name: Results match the expectations exactly
        run: |
          pip install -q pyyaml
          python3 - <<'PY'
          import json, yaml
          r = json.load(open("out/report.json"))
          exp = yaml.safe_load(open("fixtures/expectations.yaml"))
          assert not r["package_substitutions"], r["package_substitutions"]
          by_file = {}
          for rec in r["records"]:
              by_file.setdefault(rec["source_file"], []).append(rec)
          for f in exp["golden"]:
              assert all(x["status"] == "pass" for x in by_file[f]), f
          for f, spec in exp["faults"].items():
              [rec] = by_file[f]
              got = {(i["message_id"], i["source_locator"]) for i in rec["issues"] if i["category"] == "error"}
              want = {(e["id"], e["at"]) for e in spec["errors"]}
              assert got == want, (f, got, want)
          print(f"Image results match expectations: {len(exp['golden'])} golden files, {len(exp['faults'])} fault files")
          PY
      - name: Dashboard is well formed
        run: python3 scripts/check_dashboard.py out/dashboard.html

  conformance:
    name: AU Core conformance (official HL7 validator)
    runs-on: ubuntu-latest
    needs: unit
    env:
      GATEWAY_VALIDATOR_XMX: 4g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e ".[dev]"

      - name: Cache validator and FHIR packages
        uses: actions/cache@v4
        with:
          path: |
            tools/validator_cli.jar
            tools/validator.release
            ~/.fhir/packages
          key: fhir-${{ hashFiles('versions.toml') }}

      - name: Download validator and pinned packages
        run: |
          python scripts/fetch_validator.py
          python scripts/fetch_packages.py

      - name: Refuse substituted packages
        run: |
          if [ -s ~/.fhir/packages/SUBSTITUTIONS.txt ]; then
            echo "Package substitutions present; CI results must come from the real packages."
            cat ~/.fhir/packages/SUBSTITUTIONS.txt
            exit 1
          fi

      - name: Validate fixtures against AU Core
        run: python -m pytest -q -m validator

      - name: Demo report and dashboard
        if: always()
        run: |
          python -m gateway run fixtures/golden fixtures/faults --out out --dashboard
          python scripts/check_dashboard.py out/dashboard.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: out/

  scale:
    name: Scale (1,000 Synthea patients, round trip)
    runs-on: ubuntu-latest
    needs: conformance
    # Pushes to main and manual runs only: it takes several minutes.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      GATEWAY_VALIDATOR_XMX: 4g
      GATEWAY_SCALE_PATIENTS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e ".[dev]"

      - name: Cache validator, Synthea and FHIR packages
        uses: actions/cache@v4
        with:
          path: |
            tools/validator_cli.jar
            tools/validator.release
            tools/synthea-with-dependencies.jar
            tools/synthea.version
            ~/.fhir/packages
          key: scale-${{ hashFiles('versions.toml') }}

      - name: Download tools and pinned packages
        run: |
          python scripts/fetch_validator.py
          python scripts/fetch_synthea.py
          python scripts/fetch_packages.py

      - name: Refuse substituted packages
        run: |
          if [ -s ~/.fhir/packages/SUBSTITUTIONS.txt ]; then cat ~/.fhir/packages/SUBSTITUTIONS.txt; exit 1; fi

      - name: Generate population and run the scale tests
        # shell: bash adds -o pipefail, so a test failure is not hidden by tee's success.
        shell: bash
        run: python -m pytest -q -s -m scale | tee scale.log

      - name: Build the published dashboard (population + planted faults)
        run: |
          # The faulted population (written by the scale tests) plus the hand-written fixtures.
          python -m gateway run data/synthea-1000-faulted fixtures/golden fixtures/faults --out site-run --dashboard \
            --faults data/synthea-1000-faulted/faults.json --no-store
          python scripts/check_dashboard.py site-run/dashboard.html
          mkdir -p site && cp site-run/dashboard.html site/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/

      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLISH_DASHBOARD == 'true'
        with:
          path: site/

      - name: Scale summary
        if: always()
        run: |
          { echo '```'; grep -E "^(Files|Patients|Lab reports|Observations|Issues|Time|Faults|Pass rate):|^  fault " scale.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Also as annotations, which are readable through the GitHub API (job summaries are not).
          # GitHub keeps at most 10 annotations per step, so fault detection has its own step below.
          grep -E "^(Files|Patients|Lab reports|Observations|Issues|Time):|^Feed fingerprint|patients -> " scale.log | while IFS= read -r line; do
            echo "::notice title=Scale run::${line}"
          done

      - name: Fault detection summary
        if: always()
        run: |
          {
            grep -E "^(Faults|Collateral|Pass rate):|^Faulted feed fingerprint" scale.log
            echo "Per type: $(grep -E '^  fault ' scale.log | awk '{print $2" "$3}' | paste -sd, - | sed 's/,/, /g')"
          } | while IFS= read -r line; do
            echo "::notice title=Fault detection::${line}"
          done

  pages:
    # Publishes the dashboard to GitHub Pages. Off until the repository variable
    # PUBLISH_DASHBOARD is set to "true" (and Pages is set to deploy from GitHub Actions).
    name: Publish dashboard to GitHub Pages
    needs: scale
    if: vars.PUBLISH_DASHBOARD == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
