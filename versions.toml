# Single source of truth for every pinned version in the project.
# Change a version here, nowhere else. CLAUDE.md and the README point at this file.

[fhir]
version = "4.0.1"

[validator]
# Official HL7 FHIR Validator (https://github.com/hapifhir/org.hl7.fhir.core/releases).
# Pinned to the release the fixtures were verified with: a newer validator can add or reword
# checks, and results must not change unless this line does.
release = "7.0.2"

[synthea]
# Synthetic patient generator (https://github.com/synthetichealth/synthea). Pinned to a tagged
# release: "latest" is a rolling master build, and the same seed must give the same patients.
release = "v3.4.0"
seed = 20261019
state = "Massachusetts"   # Synthea's demographics are US-only; the exporter localises to QLD

[packages]
# AU Core 2.0.0 is the latest published release (not the CI build).
"hl7.fhir.au.core" = "2.0.0"
"hl7.fhir.au.base" = "6.0.0"
"hl7.fhir.r4.core" = "4.0.1"
"hl7.terminology.r4" = "7.0.1"
"hl7.fhir.uv.extensions.r4" = "5.2.0"
"hl7.fhir.uv.ipa" = "1.1.0"
"hl7.fhir.uv.smart-app-launch" = "2.2.0"

[support_packages]
# Packages the validator loads for its own use, independent of AU Core.
"hl7.fhir.xver-extensions" = "0.1.0"

[terminology]
# "n/a" = offline: the validator does not check codes against a terminology server.
# Set to "https://tx.fhir.org/r4" (public HL7 server, no sign-up) when you have network access to it.
server = "n/a"

[inspector]
# Pyodide (Python compiled to WebAssembly), loaded from its official CDN by the Message
# Inspector page so the gateway's own code runs in the visitor's browser. Python 3.12.
pyodide = "0.27.7"

[design_check]
# Impeccable (https://impeccable.style, Apache 2.0): deterministic design checks (spacing,
# contrast, tap targets, generic "AI-made" patterns), no AI and no account. Advisory only:
# scripts/check_design.py reports findings in CI and never fails the build.
impeccable = "4.1.0"

[accessibility_check]
# axe-core (https://github.com/dequelabs/axe-core, MPL 2.0): automated WCAG 2.2 A/AA rules, no
# account. scripts/check_a11y.py fails CI on a serious or critical WCAG finding.
axe_core = "4.14.0"
