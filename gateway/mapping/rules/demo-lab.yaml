# Mapping rules for one source system. One file per sender: real systems disagree on
# which field holds what, so the differences live here as data, not in code.
#
# Every FHIR system URI and code below was checked against the pinned packages:
#   AU Base 6.0.0  StructureDefinition-au-ihi.json, -au-medicarecardnumber.json
#   HL7 v2 table 0203 (identifier types), table 0001 (administrative sex), table 0200 (name type)
# Do not add a URI or code without checking it against the package files.

source: demo-lab
description: Synthetic Queensland pathology lab feed used for the Phase 1 demo (HL7 v2.4)

# Who sends with these rules: MSH-3 (sending application) and MSH-4 (sending facility).
# The gateway picks each message's rules by these (gateway/ingest/routing.py). Placeholders.
sender:
  application: DEMOLAB
  facility: QLDDEMO

patient:
  identifiers:
    field: PID-3
    # First matching rule wins. "type" is CX-5 (identifier type), "authority" is CX-4.1.
    rules:
      - when: {type: NI, authority: AUSHIC}
        kind: ihi
      - when: {type: MC}
        kind: medicare
      # Only this lab's own MRNs (CX-4 DEMOLAB). An MRN is unique only within its issuer, so an
      # MRN from another organisation is not taken as this lab's: it is reported and skipped.
      - when: {type: MR, authority: DEMOLAB}
        kind: mrn
        # AU Base au-medicalrecordnumber requires a system and assigner.display.
        # Australian MRN namespaces are scoped to the organisation's HPI-O. This HPI-O is
        # SYNTHETIC (prefix 800362 + Luhn check digit); a real sender uses its own.
        # An example.org URL is rejected by the validator ("Example URLs are not allowed").
        system: http://ns.electronichealth.net.au/id/hpio-scoped/medicalrecord/1.0/8003628946342779
        assigner_display: Demo Pathology Queensland (synthetic)
  name:
    field: PID-5          # XPN: family ^ given ^ middle(s) ^ suffix ^ prefix ^ degree ^ name type
    use:                  # HL7 table 0200 -> FHIR HumanName.use
      L: official
      D: usual
      A: nickname
      M: maiden
  birth_date:
    field: PID-7          # TS: YYYY[MM[DD[HHMM[SS]]]]
  sex:
    field: PID-8
    map:                  # HL7 table 0001 -> FHIR AdministrativeGender
      F: female
      M: male
      O: other
      A: other
      U: unknown
      N: unknown
  address:
    field: PID-11        # XAD: street ^ other ^ city ^ state ^ postcode ^ country ^ type
    use:                  # HL7 table 0190 -> FHIR Address.use
      H: home
      B: work
      C: temp
    country:              # what senders write -> ISO 3166 code expected by AU Address
      AU: AU
      AUS: AU
      AUSTRALIA: AU

# Lab results arrive as ORU^R01: one OBR (the report) and one OBX per result.
# Field numbers below are HL7 v2.4 standard positions.
lab_results:
  report_id: 3            # OBR-3 filler order number: the lab's id for this report
  ordered_test: 4         # OBR-4 universal service id (this sender uses a local code)
  obx:
    value_type: 2         # OBX-2, HL7 table 0125
    code: 3               # OBX-3: code ^ display ^ coding system (LN = LOINC)
    value: 5              # OBX-5
    units: 6              # OBX-6: unit ^ ^ coding system (UCUM)
    status: 11            # OBX-11, HL7 table 0085 (F = final)
    effective: 14         # OBX-14 date/time of the observation
  numeric_types: [NM]     # value types whose OBX-5 must be a number
  # OBX-3.3 values (HL7 table 0396) meaning LOINC: their codes must pass the LOINC check digit.
  loinc_coding_systems: [LN]
  # How results become AU Core pathology Observations (au-core-diagnosticresult-path 2.0.0).
  # Every URI and code below was checked against the pinned packages; see comments.
  fhir:
    coding_systems:       # OBX-3.3 coding system name -> FHIR system (as in AU Core examples)
      LN: http://loinc.org
    unit_systems:         # OBX-6.3 -> FHIR system for Quantity.system (as in AU Core examples)
      UCUM: http://unitsofmeasure.org
    status:               # HL7 table 0085 (OBX-11) -> FHIR observation-status (R4 CodeSystem)
      F: final            # Final results            -> "complete, no further actions needed"
      P: preliminary      # Preliminary results      -> "initial or interim observation"
      C: corrected        # Record coming over is a correction -> "modified to correct an error"
      X: cancelled        # Results cannot be obtained -> "unavailable ... not completed"
      D: entered-in-error # Deletes the OBX record   -> "withdrawn following previous release"
    # The lab named as performer, like the AU Core example ("performer": {"display": ...}).
    performer_display: Demo Pathology Queensland (synthetic)
